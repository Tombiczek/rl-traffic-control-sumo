[project]
name = "master_thesis"
version = "0.1.0"
description = "Study of the Impact of Machine Learning-Based Intelligent Traffic Control in Simulated Conditions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "traci",
    #    "numpy",
    "pandas",
    #   "scikit-learn>=1.8,<2.0",
    "matplotlib",
    #   "ipykernel>=7.2.0",
    #   "pandas-stubs~=3.0.0",
    #   "fastparquet>=2025.12.0",
    "torch",
    "sumo_rl",
    "gymnasium",
    "numpy",
    "huggingface_hub",
    #   "wandb>=0.16,<1.0",
    #   "tsai>=0.4.1",
    #   "joblib>=1.5.3",
    #   "xgboost>=3.2.0"
    "stable_baselines3",
    "ipykernel>=7.2.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0,<10.0",
  "ruff>=0.15,<1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
